// 1. Create a Google Sheet, open Extensions > Apps Script, paste the provided Code.gs script.
// 2. Deploy > New deployment > Web app (Execute as: Me, Who has access: Anyone).
// 3. Copy the deployment URL and paste it below, replacing the placeholder.
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyInQ0EatYolTmr_uwiCwlrbpcScEpdAi-5k4kL7ZwjKAQqdfDqoOoK2rScG-VThuQFJw/exec";

const storage = {
  async listInvoices() {
    const res = await fetch(`${SHEET_API_URL}?action=list`);
    if (!res.ok) throw new Error(`List failed: HTTP ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data.invoices || [];
  },
  async saveInvoice(invoice) {
    const url = `${SHEET_API_URL}?action=save&invoice=${encodeURIComponent(JSON.stringify(invoice))}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Save failed: HTTP ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
  },
  async deleteInvoice(id) {
    const url = `${SHEET_API_URL}?action=delete&id=${encodeURIComponent(id)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Delete failed: HTTP ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
  },
};

  accessionNo: "",
  invoiceNo: "",
  paymentMode: "CASH",
  rows: [emptyRow()],
  savedAt: null,
});

function toSAR(n) {
  const v = Number(n) || 0;
  return v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function rowAmount(row) { return (Number(row.qty) || 0) * (Number(row.price) || 0); }
function invoiceTotal(inv) { return inv.rows.reduce((sum, r) => sum + rowAmount(r), 0); }

function InvoiceSystem() {
  const [view, setView] = useState("editor");
  const [invoice, setInvoice] = useState(emptyInvoice());
  const [savedInvoices, setSavedInvoices] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState("");
  const [search, setSearch] = useState("");
  const [customDept, setCustomDept] = useState(false);
  const [deptCode, setDeptCode] = useState("");
  const [exporting, setExporting] = useState(false);
  const sheetRef = useRef(null);

  useEffect(() => {
    setCustomDept(invoice.billTo !== "" && !DEPARTMENTS.some((d) => d.name === invoice.billTo));
    const match = DEPARTMENTS.find((d) => d.name === invoice.billTo);
    setDeptCode(match ? match.code : "");
  }, [invoice.id]);

  const handleDeptCodeChange = (value) => {
    setDeptCode(value);
    const match = DEPARTMENTS.find((d) => d.code === value.trim());
    if (match) {
      setCustomDept(false);
      updateField("billTo", match.name);
    }
  };

  const handleTestCodeChange = (id, value) => {
    const match = TEST_CATALOG.find((t) => t.code === value.trim());
    if (match) {
      updateRowMulti(id, { code: match.code, name: match.name, price: match.price });
    } else {
      updateRow(id, "code", value);
    }
  };

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2500); };

  const loadInvoices = useCallback(async () => {
    try {
      const items = await storage.listInvoices();
      items.sort((a, b) => (b.savedAt || "").localeCompare(a.savedAt || ""));
      setSavedInvoices(items);
    } catch (e) {
      setSavedInvoices([]);
      showToast("Could not load shared invoices — check the connection setup");
    }
    setLoading(false);
  }, []);

  useEffect(() => { loadInvoices(); }, [loadInvoices]);

  useEffect(() => {
    if (SHEET_API_URL.includes("PASTE_YOUR")) {
      showToast("Shared storage isn't connected yet — see the setup comment in the code");
    }
  }, []);

  const updateField = (field, value) => setInvoice((prev) => ({ ...prev, [field]: value }));
  const updateRow = (id, field, value) => setInvoice((prev) => ({
    ...prev, rows: prev.rows.map((r) => (r.id === id ? { ...r, [field]: value } : r)),
  }));
  const updateRowMulti = (id, patch) => setInvoice((prev) => ({
    ...prev, rows: prev.rows.map((r) => (r.id === id ? { ...r, ...patch } : r)),
  }));
  const addRow = () => setInvoice((prev) => ({ ...prev, rows: [...prev.rows, emptyRow()] }));
  const removeRow = (id) => setInvoice((prev) => ({
    ...prev, rows: prev.rows.length > 1 ? prev.rows.filter((r) => r.id !== id) : prev.rows,
  }));

  const saveInvoice = async () => {
    setSaving(true);
    const toSave = { ...invoice, savedAt: new Date().toISOString() };
    try {
      await storage.saveInvoice(toSave);
      setInvoice(toSave);
      showToast("Invoice saved");
      loadInvoices();
    } catch (e) { showToast("Could not save: " + (e && e.message ? e.message : "unknown error")); }
    setSaving(false);
  };

  const downloadPdf = async () => {
    setExporting(true);
    try {
      if (!window.html2canvas || !window.jspdf) {
        showToast("PDF libraries did not load — open this file directly in your device browser");
        setExporting(false);
        return;
      }
      const canvas = await window.html2canvas(sheetRef.current, { scale: 2, backgroundColor: "#ffffff" });
      const imgData = canvas.toDataURL("image/png");
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: "portrait", unit: "pt", format: "a4" });
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const imgRatio = canvas.height / canvas.width;
      let imgWidth = pageWidth;
      let imgHeight = imgWidth * imgRatio;
      if (imgHeight > pageHeight) { imgHeight = pageHeight; imgWidth = imgHeight / imgRatio; }
      pdf.addImage(imgData, "PNG", (pageWidth - imgWidth) / 2, 0, imgWidth, imgHeight);
      pdf.save(`invoice-${invoice.invoiceNo || invoice.id}.pdf`);
    } catch (e) {
      showToast("Could not generate PDF: " + (e && e.message ? e.message : "unknown error"));
    }
    setExporting(false);
  };

  const deleteInvoice = async (id) => {
    try { await storage.deleteInvoice(id); showToast("Invoice deleted"); loadInvoices(); }
    catch (e) { showToast("Could not delete"); }
  };

  const openInvoice = (inv) => { setInvoice(inv); setView("editor"); };
  const newInvoice = () => { setInvoice(emptyInvoice()); setView("editor"); };

  const total = invoiceTotal(invoice);
  const filteredList = savedInvoices.filter((inv) => {
    const q = search.trim();
    if (!q) return true;
    return (inv.billTo || "").toLowerCase().includes(q.toLowerCase())
      || (inv.invoiceNo || "").toLowerCase().includes(q.toLowerCase())
      || (inv.accessionNo || "").toLowerCase().includes(q.toLowerCase());
  });

  return (
    <div dir="ltr" style={{ fontFamily: FONT, background: "#F6F5F1", minHeight: "100vh", color: "#1C2624" }}>
      <style>{`
        @media print {
          .no-print { display: none !important; }
          .print-area { box-shadow: none !important; margin: 0 !important; }
          body { background: white !important; }
        }
        input:focus, textarea:focus, select:focus { outline: 2px solid #0F5257; outline-offset: 1px; }
        button { transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease; }
        button:hover:not(:disabled) { transform: translateY(-1px); }
        button:active:not(:disabled) { transform: translateY(0); }
        button:disabled { opacity: 0.6; cursor: default; }
        .line-table tbody tr:nth-child(even) { background: #FAFAF7; }
        .line-table tbody tr:hover { background: #F1F6F5; }
        input:hover, select:hover { border-color: #9DB4B2; }

        @media (max-width: 640px) {
          .invoice-sheet { padding: 16px 12px !important; }
          .meta-grid { grid-template-columns: 1fr !important; }
          .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
          .line-table { min-width: 620px; }
          .header-logo { width: 56px !important; }
          .top-bar { padding: 10px 12px !important; }
          .payment-total-row { flex-direction: column; align-items: flex-start !important; gap: 16px; }
          .payment-total-row > div:last-child { text-align: left !important; align-self: stretch; }
        }
      `}</style>

      <div className="no-print top-bar" style={{ background: "linear-gradient(135deg, #0E5C62 0%, #0A3F43 100%)", color: "#F6F5F1", padding: "14px 24px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <img src={LOGO_SRC} alt="Hail Health Cluster" style={{ width: 34, height: 34, objectFit: "contain", background: "white", borderRadius: "50%", padding: 3 }} />
          <div>
            <div style={{ fontWeight: 700, fontSize: 15 }}>Hail Regional Laboratory</div>
            <div style={{ fontSize: 11.5, opacity: 0.75 }}>Invoice System — Revenue Development Department</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => setView(view === "editor" ? "list" : "editor")} style={btnGhost}>
            {view === "editor" ? "Saved Invoices" : (
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}><ArrowLeft size={15} /> Back to Editor</span>
            )}
          </button>
          {view === "editor" && <button onClick={newInvoice} style={btnGhost}>New Invoice</button>}
        </div>
      </div>

      {toast && (
        <div className="no-print" style={{ position: "fixed", top: 70, right: 20, background: "#1C2624", color: "#F6F5F1", padding: "10px 16px", borderRadius: 8, fontSize: 13.5, zIndex: 50, boxShadow: "0 4px 14px rgba(0,0,0,0.2)", maxWidth: 280 }}>
          {toast}
        </div>
      )}

      {view === "list" ? (
        <div style={{ maxWidth: 820, margin: "0 auto", padding: "28px 20px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18 }}>
            <Search size={16} color="#6B7A78" />
            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search by name, invoice number, or accession number"
              style={{ flex: 1, padding: "10px 12px", borderRadius: 8, border: "1px solid #D8D4C8", fontFamily: FONT, fontSize: 13.5, background: "white" }} />
          </div>

          {loading ? (
            <div style={{ textAlign: "center", padding: 40, color: "#6B7A78" }}>Loading...</div>
          ) : filteredList.length === 0 ? (
            <div style={{ textAlign: "center", padding: 50, color: "#6B7A78", fontSize: 14 }}>
              No saved invoices yet. Once you save an invoice from the editor, it will appear here.
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {filteredList.map((inv) => (
                <div key={inv.id} style={{ background: "white", border: "1px solid #E4E1D6", borderRadius: 10, padding: "14px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
                  <div style={{ cursor: "pointer", flex: 1 }} onClick={() => openInvoice(inv)}>
                    <div style={{ fontWeight: 700, fontSize: 14.5 }}>
                      {inv.billTo || "Unnamed"} {inv.invoiceNo && `— Invoice No ${inv.invoiceNo}`}
                    </div>
                    <div style={{ fontSize: 12, color: "#6B7A78", marginTop: 3 }}>
                      {inv.invoiceDate} · Accession No: {inv.accessionNo || "—"} · Total: {toSAR(invoiceTotal(inv))} SAR
                    </div>
                  </div>
                  <button onClick={() => deleteInvoice(inv.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "#B5544B", padding: 6 }} aria-label="Delete">
                    <Trash2 size={16} />
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      ) : (
        <div style={{ maxWidth: 900, margin: "0 auto", padding: "24px 16px 60px" }}>
          <div className="no-print" style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
            <button onClick={saveInvoice} disabled={saving} style={btnPrimary}>
              <Save size={15} /> {saving ? "Saving..." : "Save Invoice"}
            </button>
            <button onClick={() => window.print()} style={btnSecondary}>
              <Printer size={15} /> Print
            </button>
            <button onClick={downloadPdf} disabled={exporting} style={btnSecondary}>
              <Download size={15} /> {exporting ? "Preparing..." : "Download PDF"}
            </button>
          </div>

          <div ref={sheetRef} className="print-area invoice-sheet" style={{ background: "white", border: "1px solid #E9E6DA", borderRadius: 12, boxShadow: "0 1px 2px rgba(20,30,28,0.04), 0 8px 24px rgba(20,30,28,0.06)", padding: "34px 38px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", borderBottom: "3px solid #0F5257", paddingBottom: 16, marginBottom: 22 }}>
              <div>
                <div style={{ fontSize: 18, fontWeight: 800, color: "#0F5257" }}>Kingdom of Saudi Arabia</div>
                <div style={{ fontSize: 13.5, fontWeight: 700, marginTop: 2 }}>Hail Health Cluster</div>
                <div style={{ fontSize: 13, color: "#3D4A48" }}>Hail Regional Laboratory</div>
                <div style={{ fontSize: 11.5, color: "#3D4A48", marginTop: 2 }}>Revenue Development Department</div>
                <div style={{ fontSize: 11, color: "#6B7A78", marginTop: 6 }}>Hail, Al Massif, HASC3874, 016-5353007</div>
              </div>
              <img src={LOGO_SRC} alt="Hail Health Cluster" className="header-logo" style={{ width: 92, height: "auto", objectFit: "contain" }} />
            </div>

            <div style={{ fontSize: 20, fontWeight: 800, color: "#1C2624", marginBottom: 18 }}>Invoice</div>

            <div className="meta-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 22 }}>
              <Field label="Bill To">
                <input
                  value={deptCode}
                  onChange={(e) => handleDeptCodeChange(e.target.value)}
                  placeholder="Enter department code"
                  style={{ ...inputStyle, marginBottom: 6 }}
                />
                <select
                  value={customDept ? "CUSTOM" : invoice.billTo}
                  onChange={(e) => {
                    const val = e.target.value;
                    if (val === "CUSTOM") { setCustomDept(true); updateField("billTo", ""); setDeptCode(""); }
                    else {
                      setCustomDept(false);
                      updateField("billTo", val);
                      const match = DEPARTMENTS.find((d) => d.name === val);
                      setDeptCode(match ? match.code : "");
                    }
                  }}
                  style={inputStyle}
                >
                  <option value="">Or select requesting department</option>
                  {DEPARTMENTS.map((d) => <option key={d.code} value={d.name}>{d.name}</option>)}
                  <option value="CUSTOM">Other (manual entry)</option>
                </select>
                {customDept && (
                  <input value={invoice.billTo} onChange={(e) => updateField("billTo", e.target.value)}
                    placeholder="Enter department name" style={{ ...inputStyle, marginTop: 6 }} />
                )}
              </Field>
              <Field label="Invoice Date">
                <input type="date" value={invoice.invoiceDate} onChange={(e) => updateField("invoiceDate", e.target.value)} style={inputStyle} />
              </Field>
              <Field label="Accession No">
                <input value={invoice.accessionNo} onChange={(e) => updateField("accessionNo", e.target.value)} style={inputStyle} placeholder="—" />
              </Field>
              <Field label="Invoice No">
                <input value={invoice.invoiceNo} onChange={(e) => updateField("invoiceNo", e.target.value)} style={inputStyle} placeholder="—" />
              </Field>
            </div>

            <div className="table-scroll">
            <table className="line-table" style={{ width: "100%", borderCollapse: "collapse", marginBottom: 6 }}>
              <thead>
                <tr style={{ background: "linear-gradient(180deg, #12636A 0%, #0B4E53 100%)" }}>
                  {["SN", "Test Code", "Test Name", "Qty", "Test Price", "Amount", ""].map((h, i) => (
                    <th key={i} style={{ color: "white", fontSize: 12, padding: "9px 8px", textAlign: "center", fontWeight: 700 }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {invoice.rows.map((row, idx) => {
                  const isCatalog = TEST_CATALOG.some((t) => t.code === row.code);
                  const selectValue = row.code === "" ? "" : isCatalog ? row.code : "CUSTOM";
                  return (
                    <tr key={row.id} style={{ borderBottom: "1px solid #E4E1D6" }}>
                      <td style={tdCenter}>{idx + 1}</td>
                      <td style={td}>
                        <input
                          value={row.code}
                          onChange={(e) => handleTestCodeChange(row.id, e.target.value)}
                          placeholder="Type code"
                          style={cellInput}
                        />
                      </td>
                      <td style={td}>
                        <select
                          value={selectValue}
                          onChange={(e) => {
                            const val = e.target.value;
                            if (val === "CUSTOM") updateRowMulti(row.id, { code: "" });
                            else if (val === "") updateRowMulti(row.id, { code: "", name: "" });
                            else {
                              const t = TEST_CATALOG.find((x) => x.code === val);
                              updateRowMulti(row.id, { code: t.code, name: t.name, price: row.price || t.price });
                            }
                          }}
                          style={{ ...cellInput, marginBottom: 4, fontSize: 11.5 }}
                        >
                          <option value="">Browse test name</option>
                          {TEST_CATALOG.map((t) => <option key={t.code} value={t.code}>{t.name}</option>)}
                          <option value="CUSTOM">Other (manual)</option>
                        </select>
                        {selectValue !== "" && selectValue !== "CUSTOM" ? null : (
                          <input value={row.name} onChange={(e) => updateRow(row.id, "name", e.target.value)} placeholder="Test name" style={cellInput} />
                        )}
                      </td>
                      <td style={td}>
                        <input type="number" min="0" value={row.qty} onChange={(e) => updateRow(row.id, "qty", e.target.value)} style={{ ...cellInput, textAlign: "center" }} />
                      </td>
                      <td style={td}>
                        <input type="number" min="0" value={row.price} onChange={(e) => updateRow(row.id, "price", e.target.value)} style={{ ...cellInput, textAlign: "center" }} placeholder="0.00" />
                      </td>
                      <td style={{ ...tdCenter, fontWeight: 700 }}>{toSAR(rowAmount(row))}</td>
                      <td className="no-print" style={{ ...tdCenter, width: 30 }}>
                        <button onClick={() => removeRow(row.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "#B5544B" }} aria-label="Remove row">
                          <X size={14} />
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            </div>

            <button onClick={addRow} className="no-print" style={addRowBtn}>
              <Plus size={14} /> Add Test
            </button>

            <div className="payment-total-row" style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginTop: 26, paddingTop: 16, borderTop: "1px solid #E4E1D6" }}>
              <div>
                <div style={{ fontSize: 12, color: "#6B7A78", marginBottom: 8, fontWeight: 700 }}>Payment Mode</div>
                <div style={{ display: "flex", gap: 16 }}>
                  {["CASH", "CREDIT"].map((mode) => (
                    <label key={mode} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, cursor: "pointer" }}>
                      <input type="radio" name="paymentMode" checked={invoice.paymentMode === mode} onChange={() => updateField("paymentMode", mode)} />
                      {mode === "CASH" ? "Cash" : "Credit"}
                    </label>
                  ))}
                </div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 12, color: "#6B7A78", fontWeight: 700 }}>Total (SAR)</div>
                <div style={{ fontSize: 26, fontWeight: 800, color: "#0F5257" }}>{toSAR(total)}</div>
              </div>
            </div>

            <div style={{ display: "flex", justifyContent: "flex-start", marginTop: 40 }}>
              <div style={{ minWidth: 200 }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: "#6B7A78" }}>Accountant</div>
                <div style={{ borderBottom: "1px solid #1C2624", height: 34, marginTop: 6 }} />
                <div style={{ fontSize: 11, color: "#6B7A78", marginTop: 4 }}>Signature</div>
              </div>
            </div>

            <div style={{ marginTop: 28, fontSize: 10.5, color: "#9AA3A1", textAlign: "center" }}>
              Currency used in invoices: Saudi Riyals (SAR)
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div>
      <div style={{ fontSize: 11.5, color: "#6B7A78", fontWeight: 700, marginBottom: 4 }}>{label}</div>
      {children}
    </div>
  );
}

const inputStyle = { width: "100%", padding: "9px 11px", borderRadius: 8, border: "1px solid #DCD8CC", fontFamily: FONT, fontSize: 13.5, color: "#1C2624", background: "#FFFFFF", boxSizing: "border-box", transition: "border-color 0.15s ease, box-shadow 0.15s ease" };
const cellInput = { width: "100%", border: "none", background: "transparent", fontFamily: FONT, fontSize: 13, padding: "9px 7px", boxSizing: "border-box" };
const td = { padding: "2px 4px", textAlign: "center" };
const tdCenter = { padding: "11px 4px", textAlign: "center", fontSize: 13 };
const btnGhost = { background: "rgba(255,255,255,0.10)", color: "#F6F5F1", border: "1px solid rgba(255,255,255,0.28)", borderRadius: 8, padding: "8px 15px", fontFamily: FONT, fontSize: 12.5, fontWeight: 600, cursor: "pointer" };
const btnPrimary = { background: "linear-gradient(180deg, #12636A 0%, #0B4E53 100%)", color: "white", border: "none", borderRadius: 8, padding: "10px 18px", fontFamily: FONT, fontSize: 13, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 7, boxShadow: "0 2px 6px rgba(11,78,83,0.28)" };
const btnSecondary = { background: "white", color: "#0B4E53", border: "1px solid #C7D6D5", borderRadius: 8, padding: "10px 18px", fontFamily: FONT, fontSize: 13, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 7, boxShadow: "0 1px 2px rgba(0,0,0,0.04)" };
const addRowBtn = { background: "#F3F6F5", border: "1px dashed #9DB4B2", color: "#0B4E53", borderRadius: 7, padding: "8px 16px", fontFamily: FONT, fontSize: 12.5, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 };

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<InvoiceSystem />);
</script>
</body>
</html>
